<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F5EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sonmira">
<title>Sonmira</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Hanken+Grotesk:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="4" seed="7" result="n"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
  </filter>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"></feTurbulence>
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.37  0 0 0 0 0.3  0.55 0 0 0 -0.18"></feColorMatrix>
  </filter>
</svg>
<div id="stage"><div id="app" class="device"></div></div>
<script>
// TEMPORARY (preview debugging, remove before merge): if the app fails to start, show why instead of a blank page.
(function () {
  var errs = [];
  function show() {
    var el = document.getElementById('app'); if (!el || el.children.length) return;
    el.style.cssText = 'padding:24px;font:13px/1.5 -apple-system,sans-serif;color:#333;white-space:pre-wrap;word-break:break-word;overflow:auto';
    el.textContent = 'Sonmira could not start.\n\n' + (errs.join('\n\n') || 'No error was reported.') + '\n\n' + navigator.userAgent;
  }
  window.addEventListener('error', function (e) { errs.push((e.message || 'error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; errs.push('Unhandled: ' + (r && (r.stack || r.message) || r)); });
  window.__bootFailed = function () { errs.push('src/app/main.js (or a file it imports) failed to load'); };
  setTimeout(show, 4000);
})();
</script>
<script type="module" src="src/app/main.js" onerror="__bootFailed()"></script>
</body>
</html>
