# Builds the iOS app for the Simulator (no signing), so the native code is
# checked on every change to it. Free on public repositories.
name: iOS build

on:
  push:
    paths: ['ios/**', 'capacitor.config.json', 'scripts/ios.mjs', 'native/**', 'package*.json', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'capacitor.config.json', 'scripts/ios.mjs', 'native/**', 'package*.json', '.github/workflows/ios.yml']

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ios
      - name: Build for the Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build | tail -n 80
          exit ${PIPESTATUS[0]}
