<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F5EF">
<title>Sonmira Support</title>
<meta name="description" content="Need help or have feedback? Contact Sonmira support.">
<link rel="icon" href="/assets/icon-180.png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Hanken+Grotesk:wght@400..600&display=swap" rel="stylesheet">
<style>
  /* Public support page (App Store Connect Support URL). Self-contained:
     no app scripts, no API calls. Tokens match styles.css. */
  :root {
    --paper: #F8F5EF; --tile: #F5F1EA; --tile-line: #E6DFD3;
    --ink: #1F1D1A; --body: #5E5850; --secondary: #8C867D; --underline: #DDD6CA;
    --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
    --sans: 'Hanken Grotesk', -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: var(--sans); font-size: 16px; line-height: 1.55;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    padding: max(48px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  }
  main { width: 100%; max-width: 520px; margin: 0 auto; flex: 1; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--secondary); font-size: 14px; letter-spacing: .02em; margin-bottom: 40px; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 40px; line-height: 1.1; margin: 0 0 16px; letter-spacing: -.01em; }
  p { margin: 0 0 16px; color: var(--body); }
  .card { background: var(--tile); border: 1px solid var(--tile-line); border-radius: 16px; padding: 20px; margin: 32px 0; }
  .label { font-size: 13px; color: var(--secondary); margin-bottom: 4px; }
  .email { font-size: 18px; font-weight: 500; color: var(--ink); text-decoration: underline; text-decoration-color: var(--underline); text-underline-offset: 4px; word-break: break-all; }
  footer { width: 100%; max-width: 520px; margin: 48px auto 0; font-size: 13px; color: var(--secondary); }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/assets/icon-180.png" alt="" width="32" height="32">Sonmira</div>
  <h1>Sonmira Support</h1>
  <p>Need help or have feedback? We'd love to hear from you.</p>
  <div class="card">
    <div class="label">Email</div>
    <a class="email" href="mailto:sonmirasupport@gmail.com">sonmirasupport@gmail.com</a>
  </div>
</main>
<footer>&copy; Sonmira</footer>
</body>
</html>
